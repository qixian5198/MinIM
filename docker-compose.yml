services:
  postgres:
    image: postgres:16-alpine
    container_name: minim-postgres
    environment:
      POSTGRES_USER: minim
      POSTGRES_PASSWORD: minim_dev
      POSTGRES_DB: minim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minim"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: minim-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: minim-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minim
      MINIO_ROOT_PASSWORD: minim_dev_123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
