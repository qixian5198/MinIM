<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MinIM</title>
<style>
  :root { --line:#e5e5e5; --muted:#888; --bg:#f7f7f5; --accent:#1a6ceb; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,"PingFang SC",sans-serif; background:var(--bg); height:100vh; overflow:hidden; }
  button { cursor:pointer; border:1px solid var(--line); background:#fff; border-radius:6px; padding:4px 10px; font:inherit; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  input, textarea { font:inherit; border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  #app { display:none; height:100%; }
  #auth { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:24px; width:320px; display:flex; flex-direction:column; gap:8px; }
  .card h1 { font-size:18px; margin:0; }
  #main { display:flex; height:100%; }
  #rooms { width:240px; border-right:1px solid var(--line); background:#fff; overflow-y:auto; display:flex; flex-direction:column; }
  #rooms .head { padding:10px 12px; border-bottom:1px solid var(--line); font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  .room-item { padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; gap:8px; align-items:center; }
  .room-item.active { background:#eef4ff; }
  .room-item .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .room-item .last { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:120px; }
  .badge { background:#e33; color:#fff; border-radius:9px; font-size:11px; padding:0 6px; }
  #chat { flex:1; display:none; flex-direction:column; }
  #msgs { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:70%; padding:6px 10px; border-radius:10px; background:#fff; border:1px solid var(--line); white-space:pre-wrap; word-break:break-word; }
  .msg.mine { align-self:flex-end; background:#d6e9ff; }
  .msg .who { font-size:11px; color:var(--muted); margin-bottom:2px; }
  .msg.system { align-self:center; background:transparent; border:none; color:var(--muted); font-size:12px; }
  #input-bar { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); background:#fff; }
  #input-bar input { flex:1; }
  #status { font-size:12px; color:var(--muted); padding:4px 10px; background:#fff; border-top:1px solid var(--line); }
  .row { display:flex; gap:8px; }
</style>
</head>
<body>

<div id="auth" class="card">
  <h1>MinIM</h1>
  <div class="row">
    <input id="username" placeholder="用户名（3-20 位字母数字_）">
    <input id="password" type="password" placeholder="密码（8-32，含字母数字）">
  </div>
  <button class="primary" id="btn-login">登录</button>
  <button id="btn-register">注册</button>
  <div id="auth-err" style="color:#c33"></div>
</div>

<div id="app">
  <div id="main">
    <div id="rooms">
      <div class="head"><span>会话</span><button id="btn-new">搜索加人</button></div>
      <div id="room-list"></div>
    </div>
    <div id="chat">
      <div id="chat-title" style="padding:10px;border-bottom:1px solid var(--line)"></div>
      <div id="msgs"></div>
      <div id="input-bar">
        <input id="msg-input" placeholder="输入消息，Enter 发送" maxlength="4096">
        <button class="primary" id="btn-send">发送</button>
      </div>
      <div id="status">连接中…</div>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let tokens = null, me = null, rooms = [], activeRoom = null;
let ws = null, lastSeq = 0, wsTimer = null, reconnectDelay = 1000;
const API = "/api/v1";
let msgCursor = null, msgHasMore = false, loadingMsgs = false;

async function api(path, opts = {}) {
  opts.headers = Object.assign({}, opts.headers);
  if (tokens) opts.headers["Authorization"] = "Bearer " + tokens.access_token;
  const r = await fetch(API + path, Object.assign({ method: "GET" }, opts,
    opts.body ? { headers: Object.assign({ "Content-Type": "application/json" }, opts.headers) } : {}));
  if (r.status === 401) { logout(); throw new Error("未登录"); }
  const j = await r.json().catch(() => ({}));
  if (j.code !== 0) throw new Error(j.message || ("HTTP " + r.status));
  return j.data;
}

function logout() {
  tokens = me = null; activeRoom = null; rooms = [];
  closeWS();
  $("auth").style.display = "flex"; $("app").style.display = "none";
}

async function doAuth(register) {
  $("auth-err").textContent = "";
  try {
    const path = register ? "/auth/register" : "/auth/login";
    const data = await api(path, { method: "POST", body: JSON.stringify({
      username: $("username").value.trim(),
      password: $("password").value,
      nickname: register ? $("username").value.trim() : undefined,
    })});
    tokens = data; me = data.user;
    await enter();
  } catch (e) { $("auth-err").textContent = e.message; }
}
$("btn-login").onclick = () => doAuth(false);
$("btn-register").onclick = () => doAuth(true);

async function enter() {
  $("auth").style.display = "none"; $("app").style.display = "block";
  rooms = (await api("/rooms")).list;
  renderRooms();
  connectWS();
  let unread = 0;
  for (const r of rooms) unread += r.unread_count;
  document.title = (unread ? `(${unread}) ` : "") + "MinIM · " + me.nickname;
}

function roomTitle(r) {
  if (r.type === 2) return r.name || "群聊";
  // 单聊显示对方昵称：room.name 是房主名或空，用 members 兜底 —— 简单起见直接用房名
  return r.name || ("单聊 #" + r.id);
}

function renderRooms() {
  const list = $("room-list"); list.innerHTML = "";
  for (const r of rooms) {
    const d = document.createElement("div");
    d.className = "room-item" + (activeRoom && activeRoom.id === r.id ? " active" : "");
    const last = r.last_message && r.last_message.content ? r.last_message.content : "（暂无消息）";
    d.innerHTML = `<div><div class="name">${esc(roomTitle(r))}</div><div class="last">${esc(last)}</div></div>` +
      (r.unread_count ? `<span class="badge">${r.unread_count}</span>` : "");
    d.onclick = () => openRoom(r.id);
    list.appendChild(d);
  }
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

async function openRoom(id) {
  activeRoom = rooms.find(r => r.id === id);
  const msgsEl = $("msgs"); msgsEl.innerHTML = "";
  $("chat").style.display = "flex";
  $("chat-title").textContent = roomTitle(activeRoom) + "（#" + id + "）";
  msgCursor = null; msgHasMore = false; loadingMsgs = false;
  await loadHistory();
  markReadAll();
  renderRooms();
}

async function loadHistory() {
  const q = msgCursor ? `?limit=20&cursor=${msgCursor}` : "?limit=20";
  const data = await api(`/rooms/${activeRoom.id}/messages${q}`);
  const box = $("msgs");
  const frag = document.createDocumentFragment();
  for (const m of data.list) frag.appendChild(msgEl(m));
  box.insertBefore(frag, box.firstChild);
  msgCursor = data.next_cursor; msgHasMore = data.has_more;
  if (!data.has_more) box.dataset.oldest = "1"; else box.dataset.oldest = "0";
  // 上滑触顶翻页
  box.onscroll = () => {
    if (box.scrollTop < 40 && msgHasMore && !loadingMsgs && box.dataset.oldest === "0") {
      loadingMsgs = true;
      loadHistory().then(() => { loadingMsgs = false; });
    }
  };
}

function msgEl(m) {
  const d = document.createElement("div");
  if (m.type === 2) { // 撤回/系统占位
    d.className = "msg system";
    const who = m.extra && m.extra.by ? m.extra.by : "";
    d.textContent = "消息已撤回" + (who ? `（${who}）` : "");
    return d;
  }
  d.className = "msg" + (m.from_uid === String(me.id) ? " mine" : "");
  d.dataset.id = m.id;
  const who = m.from_uid === String(me.id) ? "我" : "用户" + m.from_uid;
  d.innerHTML = `<div class="who">${esc(who)} · ${new Date(m.created_at).toLocaleTimeString()}</div>${esc(m.content)}`;
  return d;
}

function markReadAll() {
  const box = $("msgs");
  let last = 0;
  for (const el of box.querySelectorAll(".msg[data-id]")) last = Math.max(last, Number(el.dataset.id));
  if (last) api(`/rooms/${activeRoom.id}/read`, { method: "POST", body: JSON.stringify({ last_read_msg_id: String(last) }) })
    .then(() => ws && ws.readyState === 1 && ws.send(JSON.stringify({ type: "message.read", data: { room_id: activeRoom.id, last_read_msg_id: last } })))
    .catch(() => {});
}

async function refreshRooms() {
  rooms = (await api("/rooms")).list;
  if (activeRoom) activeRoom = rooms.find(r => r.id === activeRoom.id) || activeRoom;
  renderRooms();
  let unread = 0; for (const r of rooms) unread += r.unread_count;
  document.title = (unread ? `(${unread}) ` : "") + "MinIM · " + me.nickname;
}

$("btn-send").onclick = send;
$("msg-input").onkeydown = (e) => { if (e.key === "Enter") send(); };
async function send() {
  const text = $("msg-input").value.trim();
  if (!text || !activeRoom) return;
  $("msg-input").value = "";
  const m = await api("/messages", { method: "POST", body: JSON.stringify({ room_id: activeRoom.id, content: text }) });
  $("msgs").appendChild(msgEl(m));
  $("msgs").scrollTop = 1e9;
  markReadAll();
  refreshRooms().catch(() => {});
}

$("btn-new").onclick = async () => {
  const uid = prompt("输入要添加的用户 ID");
  if (!uid) return;
  const data = await api("/rooms/single", { method: "POST", body: JSON.stringify({ target_uid: uid }) });
  await refreshRooms();
  openRoom(data.id);
};

// ---------- WebSocket：断线指数退避重连，last_seq 补发（验收 1/4） ----------
function wsUrl() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  return `${proto}://${location.host}/ws?token=${encodeURIComponent(tokens.access_token)}&last_seq=${lastSeq}`;
}
function connectWS() {
  ws = new WebSocket(wsUrl());
  ws.onopen = () => { reconnectDelay = 1000; $("status").textContent = "已连接"; sendPing(); };
  ws.onclose = (e) => {
    if (e.code === 4001) { logout(); return; }
    $("status").textContent = "断线，" + reconnectDelay / 1000 + " 秒后重连…";
    wsTimer = setTimeout(connectWS, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 30000);
  };
  ws.onmessage = (ev) => {
    const f = JSON.parse(ev.data);
    if (f.type === "pong") return;
    if (typeof f.seq === "number") lastSeq = f.seq;
    if (f.type === "sync.done") return;
    if (f.type === "message.new") onMessage(f.data);
    if (f.type === "message.read") markReadAll();
    if (f.type.startsWith("room.") || f.type.startsWith("friend.")) refreshRooms().catch(() => {});
  };
}
function closeWS() { if (ws) { ws.onclose = null; ws.close(); } clearTimeout(wsTimer); }
function sendPing() { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "ping" })); }
setInterval(sendPing, 30000); // 服务端 60s 心跳超时，30s 一次

function onMessage(m) {
  // 自己发的消息 send() 已渲染过，靠 id 去重
  if ($("msgs").querySelector(`[data-id="${m.id}"]`)) return;
  if (activeRoom && m.room_id === activeRoom.id) {
    $("msgs").appendChild(msgEl(m));
    $("msgs").scrollTop = 1e9;
    markReadAll();
  }
  refreshRooms().catch(() => {});
}
</script>
</body>
</html>
