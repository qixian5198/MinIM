<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MinIM</title>
<style>
  :root { --line:#e5e5e5; --muted:#888; --bg:#f7f7f5; --accent:#1a6ceb; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,"PingFang SC",sans-serif; background:var(--bg); height:100vh; overflow:hidden; }
  button { cursor:pointer; border:1px solid var(--line); background:#fff; border-radius:6px; padding:4px 10px; font:inherit; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  input, textarea { font:inherit; border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  h3 { font-size:12px; color:var(--muted); margin:10px 0 4px; letter-spacing:1px; }
  #auth { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:10; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:24px; width:340px; display:flex; flex-direction:column; gap:8px; }
  .card h1 { font-size:18px; margin:0; }
  .row { display:flex; gap:8px; }
  #app { display:none; height:100%; }
  #main { display:flex; height:100%; }
  #side { width:280px; border-right:1px solid var(--line); background:#fff; overflow-y:auto; }
  #side .sec { padding:0 12px; }
  .friend-item { display:flex; align-items:center; gap:6px; padding:6px 4px; cursor:pointer; }
  .friend-item:hover { background:#f0f0f0; }
  .friend-item .info { flex:1; min-width:0; }
  .friend-item .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
  .friend-item .sub { font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .friend-item .ops { display:none; gap:4px; }
  .friend-item:hover .ops { display:flex; }
  .friend-item .ops button { padding:1px 6px; font-size:12px; }
  .room-item { padding:8px 12px; cursor:pointer; border-bottom:1px solid #f0f0f0; }
  .room-item:hover { background:#f7f7f7; }
  .room-item.active { background:#eef4ff; }
  .room-item .name { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .room-item .last { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tag { font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 4px; margin-left:6px; }
  .badge { background:#e33; color:#fff; border-radius:9px; font-size:11px; padding:0 6px; margin-left:6px; }
  #chat { flex:1; display:none; flex-direction:column; min-width:0; }
  #chat-title { padding:10px 14px; border-bottom:1px solid var(--line); background:#fff; font-weight:600; display:flex; align-items:center; gap:8px; }
  #chat-title .ops { font-weight:400; margin-left:auto; display:flex; gap:6px; }
  #msgs { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:70%; padding:6px 10px; border-radius:10px; background:#fff; border:1px solid var(--line); white-space:pre-wrap; word-break:break-word; }
  .msg.mine { align-self:flex-end; background:#d6e9ff; }
  .msg .who { font-size:11px; color:var(--muted); margin-bottom:2px; }
  .msg.system { align-self:center; background:transparent; border:none; color:var(--muted); font-size:12px; }
  #input-bar { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); background:#fff; }
  #input-bar input { flex:1; }
  #status { font-size:12px; color:var(--muted); padding:4px 10px; background:#fff; border-top:1px solid var(--line); }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.3); display:none; align-items:center; justify-content:center; z-index:20; }
  #modal .card { width:360px; }
  .pick { display:flex; align-items:center; gap:6px; padding:3px 0; }
</style>
</head>
<body>

<div id="auth" class="card">
  <h1>MinIM</h1>
  <div class="row">
    <input id="username" placeholder="用户名（3-20 位字母数字_）">
    <input id="password" type="password" placeholder="密码（8-32，字母+数字）">
  </div>
  <button class="primary" id="btn-login">登录</button>
  <button id="btn-register">注册</button>
  <div id="auth-err" style="color:#c33"></div>
</div>

<div id="app">
  <div id="main">
    <div id="side">
      <div class="sec">
        <h3>搜索用户</h3>
        <input id="search" placeholder="按用户名/昵称搜索" style="width:100%">
        <div id="search-results"></div>
      </div>
      <div class="sec">
        <h3>好友申请<span id="req-badge"></span></h3>
        <div id="req-list"><div class="sub" style="color:var(--muted);font-size:12px">暂无申请</div></div>
      </div>
      <div class="sec">
        <h3>我的好友</h3>
        <div id="friend-list"></div>
      </div>
      <div class="sec">
        <h3>群聊 <button id="btn-new-group" style="float:right;font-size:11px;padding:0 6px">+</button></h3>
        <div id="group-list"></div>
      </div>
      <div class="sec">
        <h3>全部会话</h3>
        <div id="room-list"></div>
      </div>
    </div>
    <div id="chat">
      <div id="chat-title"><span id="ct-name"></span><span class="ops" id="ct-ops"></span></div>
      <div id="msgs"></div>
      <div id="input-bar">
        <button id="btn-attach" title="发图片/文件">📎</button>
        <input type="file" id="file-input" accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.zip" style="display:none">
        <input id="msg-input" placeholder="输入消息，Enter 发送" maxlength="4096">
        <button class="primary" id="btn-send">发送</button>
      </div>
      <div id="emoji-bar" style="display:flex;gap:4px;padding:4px 10px;border-top:1px solid var(--line);background:#fff">
        <button style="border:none;font-size:18px">😀</button><button style="border:none;font-size:18px">😂</button>
        <button style="border:none;font-size:18px">👍</button><button style="border:none;font-size:18px">❤️</button>
        <button style="border:none;font-size:18px">🎉</button><button style="border:none;font-size:18px">🙏</button>
        <button style="border:none;font-size:18px">😎</button><button style="border:none;font-size:18px">🥺</button>
      </div>
      <div id="status">连接中…</div>
    </div>
  </div>
</div>

<div id="modal"><div class="card">
  <h1 id="modal-title" style="font-size:16px">新建群</h1>
  <input id="g-name" placeholder="群名称（可留空）" style="width:100%">
  <div style="margin-top:8px;font-size:12px;color:var(--muted)">选择拉入群的好友</div>
  <div id="g-picks" style="max-height:200px;overflow-y:auto"></div>
  <div class="row" style="margin-top:12px;justify-content:flex-end">
    <button id="g-cancel">取消</button>
    <button class="primary" id="g-ok">建群</button>
  </div>
</div></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let tokens = null, me = null;
let rooms = [], friends = [], requests = [], activeRoom = null;
let ws = null, lastSeq = 0, wsTimer = null, reconnectDelay = 1000, searchTimer = null;
const API = "/api/v1";
let msgCursor = null, msgHasMore = false, loadingMsgs = false;
const byId = {} // uid -> 用户信息（好友/搜索/房间消息里见过的）

async function api(path, opts = {}) {
  const o = Object.assign({ headers: {} }, opts);
  if (tokens) o.headers["Authorization"] = "Bearer " + tokens.access_token;
  if (o.body) o.headers["Content-Type"] = "application/json";
  const r = await fetch(API + path, o);
  if (r.status === 401) { logout(); throw new Error("未登录"); }
  const j = await r.json().catch(() => ({}));
  if (j.code !== 0 || r.status === 422) {
    if (Array.isArray(j.detail)) throw new Error(j.detail.map(d => `${(d.loc || []).pop()}: ${d.msg}`).join("；"));
    throw new Error(j.message || ("HTTP " + r.status));
  }
  return j.data;
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }

function logout() {
  tokens = me = activeRoom = null; rooms = friends = requests = [];
  closeWS();
  $("auth").style.display = "flex"; $("app").style.display = "none";
}
async function doAuth(register) {
  $("auth-err").textContent = "";
  try {
    const data = await api(register ? "/auth/register" : "/auth/login", { method: "POST", body: JSON.stringify({
      username: $("username").value.trim(), password: $("password").value,
      nickname: register ? $("username").value.trim() : undefined,
    })});
    tokens = data; me = data.user;
    await enter();
  } catch (e) { $("auth-err").textContent = e.message; }
}
$("btn-login").onclick = () => doAuth(false);
$("btn-register").onclick = () => doAuth(true);

async function enter() {
  $("auth").style.display = "none"; $("app").style.display = "block";
  await refreshAll();
  connectWS();
}

async function refreshAll() {
  rooms = (await api("/rooms")).list;
  friends = (await api("/friends")).list;
  requests = (await api("/friends/requests")).list;
  for (const f of friends) byId[f.user_id] = { nickname: f.nickname, avatar_url: f.avatar_url };
  renderSide();
}
function renderSide() {
  // 好友申请
  const rb = $("req-badge");
  rb.innerHTML = requests.length ? `<span class="badge">${requests.length}</span>` : "";
  $("req-list").innerHTML = requests.length ? requests.map(r => {
    byId[r.from_user.id] = { nickname: r.from_user.nickname, avatar_url: r.from_user.avatar_url };
    return `<div class="friend-item" data-req="${r.id}">
      <div class="info"><div class="nm">${esc(r.from_user.nickname || r.from_user.id)}</div>
      ${r.message ? `<div class="sub">${esc(r.message)}</div>` : ""}</div>
      <span class="ops" style="display:flex;gap:4px">
        <button data-acc="${r.id}" style="font-size:12px;padding:1px 6px">同意</button>
        <button data-rej="${r.id}" style="font-size:12px;padding:1px 6px">拒绝</button>
      </span></div>`;
  }).join("") : '<div class="sub" style="color:var(--muted);font-size:12px">暂无申请</div>';
  document.querySelectorAll("[data-acc]").forEach(b => b.onclick = () => handleReq(b.dataset.acc, "accept"));
  document.querySelectorAll("[data-rej]").forEach(b => b.onclick = () => handleReq(b.dataset.rej, "reject"));

  // 好友
  $("friend-list").innerHTML = friends.length ? friends.map(f => friendRow(f.user_id, f.nickname, f.avatar_url, f.id))
    : '<div class="sub" style="color:var(--muted);font-size:12px">还没有好友</div>';

  // 群 / 全部会话
  $("group-list").innerHTML = rooms.filter(r => r.type === 2).map(roomRow).join("") ||
    '<div class="sub" style="color:var(--muted);font-size:12px">还没有群</div>';
  $("room-list").innerHTML = rooms.map(roomRow).join("") ||
    '<div class="sub" style="color:var(--muted);font-size:12px">还没有会话</div>';
  bindRows();
  updateTitleUnread();
}
function friendRow(uid, nick, avatar, reqId) {
  return `<div class="friend-item" data-chat="${uid}">
    <div class="info"><div class="nm">${esc(nick || uid)} <span class="tag">#${uid}</span></div></div>
    <span class="ops"><button data-unf="${reqId}" style="font-size:11px;padding:1px 5px">删除</button></span>
  </div>`;
}
function roomTitleOf(r) {
  if (r.type === 2) return r.name || ("群聊#" + r.id);
  // 单聊房 name 是 null：用最后一条消息的发送方昵称兜底
  const other = r.last_message && r.last_message.from_uid !== String(me.id) ? uidName(r.last_message.from_uid) : "";
  return other || ("会话#" + r.id);
}
function roomRow(r) {
  const last = r.last_message ? (r.last_message.type === 2 ? "消息已撤回" : (r.last_message.content || "")) : "";
  return `<div class="room-item ${activeRoom && activeRoom.id === r.id ? "active" : ""}" data-room="${r.id}">
    <div class="name">${esc(roomTitleOf(r))}${r.unread_count ? `<span class="badge">${r.unread_count}</span>` : ""}</div>
    <div class="last">${esc(last)}</div></div>`;
}
function uidName(uid) { return byId[uid]?.nickname || ("用户#" + uid); }

async function bindRows() {
  document.querySelectorAll("[data-chat]").forEach(el => el.onclick = () => startSingle(el.dataset.chat));
  document.querySelectorAll("[data-unf]").forEach(el => el.onclick = async (e) => {
    e.stopPropagation();
    await api(`/friends/${el.dataset.unf}`, { method: "DELETE" });
    await refreshAll();
  });
  document.querySelectorAll("[data-room]").forEach(el => el.onclick = () => openRoom(el.dataset.room));
}

async function startSingle(uid) {
  const data = await api("/rooms/single", { method: "POST", body: JSON.stringify({ target_uid: uid }) });
  await refreshAll();
  openRoom(data.id);
}
async function handleReq(id, action) {
  await api(`/friends/requests/${id}`, { method: "PUT", body: JSON.stringify({ action }) });
  await refreshAll();
  if (action === "accept") { /* 服务端已在同事务建好单聊房，回到列表即可点进 */ }
}

// ---------- 搜索 ----------
$("search").oninput = () => {
  clearTimeout(searchTimer);
  const kw = $("search").value.trim();
  if (!kw) { $("search-results").innerHTML = ""; return; }
  searchTimer = setTimeout(async () => {
    try {
      const list = (await api(`/users/search?keyword=${encodeURIComponent(kw)}`)).list;
      $("search-results").innerHTML = list.map(u =>
        `<div class="friend-item"><div class="info"><div class="nm">${esc(u.nickname || u.username)} <span class="tag">#${u.id}</span></div></div>
        <span class="ops" style="display:flex;gap:4px">
          <button data-mchat="${u.id}" style="font-size:11px;padding:1px 5px">聊天</button>
          <button data-madd="${u.id}" style="font-size:11px;padding:1px 5px">加好友</button>
        </span></div>`).join("") || '<div class="sub" style="color:var(--muted);font-size:12px">没搜到</div>';
      for (const u of list) byId[u.id] = { nickname: u.nickname, avatar_url: u.avatar_url };
      document.querySelectorAll("[data-mchat]").forEach(b => b.onclick = () => startSingle(b.dataset.mchat));
      document.querySelectorAll("[data-madd]").forEach(b => b.onclick = async () => {
        try { await api("/friends/requests", { method: "POST", body: JSON.stringify({ to_uid: b.dataset.madd }) });
          alert("申请已发送"); }
        catch (e) { alert(e.message); }
      });
    } catch (e) { $("search-results").innerHTML = `<div style="color:#c33;font-size:12px">${esc(e.message)}</div>`; }
  }, 300);
};

// ---------- 建群 / 拉人 / 踢人 ----------
$("btn-new-group").onclick = () => {
  if (!friends.length) { alert("先加好友再建群"); return; }
  $("g-name").value = "";
  $("g-picks").innerHTML = friends.map(f =>
    `<label class="pick"><input type="checkbox" value="${f.user_id}"> ${esc(f.nickname || f.user_id)}</label>`).join("");
  $("modal").style.display = "flex";
};
$("g-cancel").onclick = () => $("modal").style.display = "none";
$("g-ok").onclick = async () => {
  const ids = [...document.querySelectorAll("#g-picks input:checked")].map(i => Number(i.value));
  if (!ids.length) { alert("至少选一位好友"); return; }
  const room = await api("/rooms/group", { method: "POST", body: JSON.stringify({
    name: $("g-name").value.trim() || null, member_ids: ids })});
  $("modal").style.display = "none";
  await refreshAll();
  openRoom(room.id);
};

async function openRoom(id) {
  activeRoom = rooms.find(r => r.id === id) || { id, type: 1, name: null, unread_count: 0 };
  const msgsEl = $("msgs"); msgsEl.innerHTML = "";
  $("chat").style.display = "flex";
  $("ct-name").textContent = `${roomTitleOf(activeRoom)}（#${id}）`;
  renderRoomOps();
  msgCursor = null; msgHasMore = false; loadingMsgs = false;
  await loadHistory();
  markReadAll();
  bindRows();
}
function renderRoomOps() {
  const ops = $("ct-ops");
  if (activeRoom.type !== 2) { ops.innerHTML = ""; return; }
  ops.innerHTML = `<button id="op-add" style="font-size:12px;padding:1px 8px">拉人</button>
    <button id="op-leave" style="font-size:12px;padding:1px 8px">退群</button>`;
  $("op-add").onclick = async () => {
    if (!friends.length) { alert("没有可拉的好友"); return; }
    const s = prompt("输入要拉入群的好友 ID（可留空跳过）");
    if (!s) return;
    const ids = s.split(/[\s,，]+/).filter(Boolean).map(Number);
    try { await api(`/rooms/${activeRoom.id}/members`, { method: "POST", body: JSON.stringify({ user_ids: ids }) });
      await refreshAll(); } catch (e) { alert(e.message); }
  };
  $("op-leave").onclick = async () => {
    if (!confirm("确定退群？群主不能退群")) return;
    try { await api(`/rooms/${activeRoom.id}/members/${me.id}`, { method: "DELETE" });
      activeRoom = null; openRoomListRefresh(); } catch (e) { alert(e.message); }
  };
}
async function openRoomListRefresh() { await refreshAll(); }

async function loadHistory() {
  const q = msgCursor ? `?limit=20&cursor=${msgCursor}` : "?limit=20";
  const data = await api(`/rooms/${activeRoom.id}/messages${q}`);
  const box = $("msgs");
  const frag = document.createDocumentFragment();
  for (const m of data.list) frag.appendChild(msgEl(m));
  box.insertBefore(frag, box.firstChild);
  msgCursor = data.next_cursor; msgHasMore = data.has_more;
  box.onscroll = () => {
    if (box.scrollTop < 40 && msgHasMore && !loadingMsgs) {
      loadingMsgs = true; loadHistory().then(() => { loadingMsgs = false; });
    }
  };
}

function msgEl(m) {
  const d = document.createElement("div");
  if (m.type === 2) {
    d.className = "msg system";
    d.textContent = "消息已撤回" + (m.extra?.by ? `（${uidName(String(m.extra.by))}）` : "");
    return d;
  }
  d.className = "msg" + (m.from_uid === String(me.id) ? " mine" : "");
  d.dataset.id = m.id;
  byId[m.from_uid] = byId[m.from_uid] || {};
  const who = m.from_uid === String(me.id) ? "我" : uidName(m.from_uid);
  const head = `<div class="who">${esc(who)} · ${new Date(m.created_at).toLocaleTimeString()}</div>`;
  if (m.type === 3) { // 图片：extra.url 是文件 ID；带鉴权，用 fetch+Blob 渲染（img 标签发不了 header）
    d.innerHTML = head + `<img src="pending" data-file="${esc(m.extra.url)}" alt="图片" style="max-width:200px;border-radius:6px;display:block">`;
    fileBlobUrl(m.extra.url).then(u => { const img = d.querySelector("img"); if (img) img.src = u; }).catch(() => {});
  } else if (m.type === 4) { // 文件：给下载链接（点击时 JS 拦截走带鉴权的 fetch）
    d.innerHTML = head + `<a data-file="${esc(m.extra.url)}" style="color:var(--accent)">📄 ${esc(m.content || "文件")}</a>`;
    d.querySelector("a").onclick = async (e) => {
      e.preventDefault();
      const u = await fileBlobUrl(m.extra.url, true);
      const a = document.createElement("a"); a.href = u; a.download = m.extra.filename || "file";
      document.body.appendChild(a); a.click(); a.remove();
    };
  } else {
    d.innerHTML = head + esc(m.content);
  }
  return d;
}

async function fileBlobUrl(fileId, revokeAfter = false) {
  const r = await fetch(`${API}/files/${fileId}`, { headers: { "Authorization": "Bearer " + tokens.access_token } });
  if (!r.ok) throw new Error("文件取失败 HTTP " + r.status);
  const u = URL.createObjectURL(await r.blob());
  if (revokeAfter) setTimeout(() => URL.revokeObjectURL(u), 60000);
  return u;
}

// ---------- 图片 / 文件 / 表情 ----------
$("btn-attach").onclick = () => $("file-input").click();
$("file-input").onchange = async () => {
  const f = $("file-input").files[0];
  if (!f || !activeRoom) return;
  try {
    const form = new FormData(); form.append("file", f);
    const r = await fetch(API + "/files", { method: "POST", body: form,
      headers: { "Authorization": "Bearer " + tokens.access_token } });
    const j = await r.json();
    if (j.code !== 0) { if (Array.isArray(j.detail)) throw new Error(j.detail.map(x => `${(x.loc||[]).pop()}: ${x.msg}`).join("；")); throw new Error(j.message); }
    const isImg = /^image\//.test(f.type);
    const m = await api("/messages", { method: "POST", body: JSON.stringify({
      room_id: activeRoom.id, type: isImg ? 3 : 4,
      content: isImg ? null : f.name,
      extra: { url: j.data.id, mime_type: f.type, size: f.size, filename: f.name },
    })});
    $("msgs").appendChild(msgEl(m));
    $("msgs").scrollTop = 1e9;
  } catch (e) { alert("发送失败：" + e.message); }
  $("file-input").value = "";
};
document.querySelectorAll("#emoji-bar button").forEach(b => b.onclick = () => {
  $("msg-input").value += b.textContent;
  $("msg-input").focus();
});

function markReadAll() {
  if (!activeRoom) return;
  const box = $("msgs");
  let last = 0;
  for (const el of box.querySelectorAll(".msg[data-id]")) last = Math.max(last, Number(el.dataset.id));
  if (!last) return;
  api(`/rooms/${activeRoom.id}/read`, { method: "POST", body: JSON.stringify({ last_read_msg_id: String(last) }) })
    .then(() => ws && ws.readyState === 1 && ws.send(JSON.stringify(
      { type: "message.read", data: { room_id: activeRoom.id, last_read_msg_id: last } })))
    .catch(() => {});
}

$("btn-send").onclick = send;
$("msg-input").onkeydown = (e) => { if (e.key === "Enter") send(); };
async function send() {
  const text = $("msg-input").value.trim();
  if (!text || !activeRoom) return;
  $("msg-input").value = "";
  const m = await api("/messages", { method: "POST", body: JSON.stringify({ room_id: activeRoom.id, content: text }) });
  $("msgs").appendChild(msgEl(m));
  $("msgs").scrollTop = 1e9;
  markReadAll();
  refreshAll().catch(() => {});
}

// ---------- WebSocket：断线指数退避重连，last_seq 补发（验收 1/4） ----------
function wsUrl() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  return `${proto}://${location.host}/ws?token=${encodeURIComponent(tokens.access_token)}&last_seq=${lastSeq}`;
}
function connectWS() {
  ws = new WebSocket(wsUrl());
  ws.onopen = () => { reconnectDelay = 1000; $("status").textContent = "已连接"; sendPing(); };
  ws.onclose = (e) => {
    if (e.code === 4001) { logout(); return; }
    $("status").textContent = "断线，" + reconnectDelay / 1000 + " 秒后重连…";
    wsTimer = setTimeout(connectWS, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 30000);
  };
  ws.onmessage = (ev) => {
    const f = JSON.parse(ev.data);
    if (f.type === "pong" || f.type === "sync.done") return;
    if (typeof f.seq === "number") lastSeq = f.seq;
    if (f.type === "message.new") onMessage(f.data);
    if (f.type === "message.read") markReadAll();
    if (f.type.startsWith("room.") || f.type.startsWith("friend.")) refreshAll().catch(() => {});
  };
}
function closeWS() { if (ws) { ws.onclose = null; ws.close(); } clearTimeout(wsTimer); }
function sendPing() { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "ping" })); }
setInterval(sendPing, 30000);

function onMessage(m) {
  if ($("msgs").querySelector(`[data-id="${m.id}"]`)) return;
  byId[m.from_uid] = byId[m.from_uid] || {};
  if (activeRoom && m.room_id === activeRoom.id) {
    $("msgs").appendChild(msgEl(m));
    $("msgs").scrollTop = 1e9;
    markReadAll();
  }
  refreshAll().catch(() => {});
}
function updateTitleUnread() {
  let n = 0; for (const r of rooms) n += r.unread_count;
  document.title = (n ? `(${n}) ` : "") + "MinIM · " + (me?.nickname || "");
}
</script>
